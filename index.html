const form=document.querySelector('form'), pin=document.querySelector('input'), button=document.querySelector('button'), status=document.getElementById('message');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  button.disabled=true;
  status.textContent='';
  try{
    if(!globalThis.crypto?.subtle){status.textContent='HTTPS 주소에서 페이지를 열어 주세요.';return}
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  }catch{
    status.textContent='비밀번호를 다시 확인해 주세요.';
    pin.select();
  }finally{button.disabled=false}
});
