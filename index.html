const form=document.querySelector('form'), pin=document.querySelector('input'), button=document.querySelector('button'), status=document.getElementById('message');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  button.disabled=true;
  status.textContent='';
  try{
    if(!globalThis.crypto?.subtle){status.textContent='HTTPS 주소에서 페이지를 열어 주세요.';return}
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
    document.open();
    document.write(new TextDecoder().decode(plain).replace('</title>', "</title><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%228%22%20fill%3D%22%23245d88%22%2F%3E%3Cpath%20fill%3D%22%239ae7ee%22%20d%3D%22M12%208.5v15l12-7.5z%22%2F%3E%3C%2Fsvg%3E\">"));
    document.close();
    const voteButton = document.querySelector('#vote button');
    if (voteButton?.textContent.trim() === '투표 준비 중') {
      voteButton.textContent = '투표하기';
      voteButton.disabled = false;
      voteButton.addEventListener('click', () => {
        window.open('https://docs.google.com/forms/d/e/1FAIpQLSeewJfOyTG6rDHfeMo9owS7mWZnGXoAXMXwqrWPdXrJilAWvw/viewform', '_blank', 'noopener,noreferrer');
      });
    }
  }catch{
    status.textContent='비밀번호를 다시 확인해 주세요.';
    pin.select();
  }finally{button.disabled=false}
});
