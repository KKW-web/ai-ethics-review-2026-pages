    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);

    document.write(new TextDecoder().decode(plain).replace('</title>', "</title><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%228%22%20fill%3D%22%23a72a3a%22%2F%3E%3Cpath%20fill%3D%22%23ffd77d%22%20d%3D%22M12%208.5v15l12-7.5z%22%2F%3E%3C%2Fsvg%3E\">"));
    document.close();
  }catch{
    status.textContent='비밀번호를 다시 확인해 주세요.';
    pin.select();
  }finally{button.disabled=false}
});
